name: Build & Deploy LifeWise

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Backend
        run: |
          java -version
          mvn --version
          cd backend
          mvn package -DskipTests --no-transfer-progress
          cp target/life-wise-backend-0.0.1-SNAPSHOT.jar ../lifewise-backend.jar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Assemble
        run: |
          mkdir -p deploy/frontend
          cp lifewise-backend.jar deploy/
          cp -r frontend/dist/* deploy/frontend/
          chmod +x deploy/start.sh deploy/stop.sh
          ls -la deploy/
          ls -la deploy/frontend/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifewise-deploy
          path: deploy/
