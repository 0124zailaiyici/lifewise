name: Build & Deploy LifeWise

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Backend JAR
        run: |
          cd backend
          mvn package -DskipTests -q
          cp target/life-wise-backend-0.0.1-SNAPSHOT.jar ../lifewise-backend.jar

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cp -r dist ../lifewise-frontend

      - name: Package deployment
        run: |
          mkdir -p deploy
          cp lifewise-backend.jar deploy/
          cp -r lifewise-frontend deploy/
          cat > deploy/start.sh << 'STARTEOF'
#!/bin/bash
cd "$(dirname "$0")"
echo "Starting LifeWise backend..."
nohup java -jar lifewise-backend.jar --spring.profiles.active=cloud > backend.log 2>&1 &
echo $! > backend.pid
echo "Backend PID: $(cat backend.pid)"
STARTEOF
          chmod +x deploy/start.sh
          cat > deploy/stop.sh << 'STOPEOF'
#!/bin/bash
cd "$(dirname "$0")"
if [ -f backend.pid ]; then
  kill $(cat backend.pid) 2>/dev/null
  rm backend.pid
  echo "Backend stopped"
else
  echo "No PID file found"
fi
STOPEOF
          chmod +x deploy/stop.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifewise-deploy
          path: deploy/
