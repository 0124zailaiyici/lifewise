name: Build & Deploy LifeWise

on:
  push:
    branches: [ master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build Backend
        run: |
          java -version
          mvn --version
          cd backend
          mvn package -Dmaven.test.skip=true --no-transfer-progress
          cp target/life-wise-backend-0.0.1-SNAPSHOT.jar ../lifewise-backend.jar
      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: lifewise-backend
          path: lifewise-backend.jar
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          ls -la dist/
      - name: Upload Frontend
        uses: actions/upload-artifact@v4
        with:
          name: lifewise-frontend
          path: frontend/dist/

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download Backend
        uses: actions/download-artifact@v4
        with:
          name: lifewise-backend
          path: deploy/
        continue-on-error: true
      - name: Copy deploy config
        run: |
          cp deploy/start.sh deploy/start.sh 2>/dev/null || true
          cp deploy/stop.sh deploy/stop.sh 2>/dev/null || true
          ls -la deploy/
      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: lifewise-frontend
          path: deploy/frontend/
        continue-on-error: true
      - name: List files
        run: ls -laR deploy/
      - name: Package deploy
        run: |
          # Copy deploy scripts
          cp deploy/start.sh deploy/start.sh 2>/dev/null || true
          cp deploy/stop.sh deploy/stop.sh 2>/dev/null || true
          cp deploy/update.sh deploy/update.sh 2>/dev/null || true
          # Verify frontend artifact
          ls deploy/frontend/index.html 2>/dev/null && echo 'Frontend OK' || echo 'Frontend not found'
          # Include prebuilt food images for /uploads/food-images/... cache hits
          mkdir -p deploy/uploads
          cp -r uploads/food-images deploy/uploads/ 2>/dev/null || true
          # Create deploy package
          cd deploy
          zip -r ../lifewise-full-deploy.zip ./
          cd ..
          ls -lh lifewise-full-deploy.zip
      - name: Upload full deploy package
        uses: actions/upload-artifact@v4
        with:
          name: lifewise-deploy
          path: lifewise-full-deploy.zip
          if-no-files-found: error



