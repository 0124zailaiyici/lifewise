spring:
  datasource:
    url: jdbc:h2:file:/opt/lifewise/data/lifewise;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
server:
  port: 8080
ai:
  api-url: ${AI_API_URL:https://api.deepseek.com/v1/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-v4-flash}
  deepseek-enabled: ${AI_DEEPSEEK_ENABLED:false}
  vision-api-url: ${AI_VISION_API_URL:}
  vision-api-key: ${AI_VISION_API_KEY:}
  vision-model: ${AI_VISION_MODEL:mimo-v2-omni}
app:
  vision-enabled: ${APP_VISION_ENABLED:true}
  upload-dir: /opt/lifewise/uploads
  image-api-key: ${IMAGE_API_KEY:}
logging:
  level:
    com.lifewise: info
gl-image:
  api-key: ${GL_IMAGE_API_KEY:}
  api-url: ${GL_IMAGE_API_URL:https://api.lk888.ai/api}
