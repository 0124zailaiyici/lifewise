spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lifewise?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false

ai:
  api-url: ${AI_API_URL:https://api.deepseek.com/v1/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-v4-flash}
  deepseek-enabled: ${AI_DEEPSEEK_ENABLED:false}
  dashscope-api-url: ${AI_DASHSCOPE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  dashscope-api-key: ${AI_DASHSCOPE_KEY:}
  dashscope-model: ${AI_DASHSCOPE_MODEL:qwen-plus}

app:
  upload-dir: ./uploads
