spring:
  application:
    name: LifeWiseBackend

  datasource:
    url: jdbc:h2:file:./data/lifewise;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

ai:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: sk-e85e1e7be2c14f6eb8555c3eff46e4ce
  model: deepseek-v4-flash
  # 图片识别（多模态）配置 - 使用小米 MiMo Omni
  vision-api-url: https://token-plan-cn.xiaomimimo.com/v1/chat/completions
  vision-api-key: tp-c71j70frfnzpxd1kzwkmi7c7mux4gter70i1zydnmeb5bl23
  vision-model: mimo-v2-omni

app:
  vision-enabled: true
  upload-dir: ./uploads
  image-api-key: '' # Pixabay API key for step images (free, get at https://pixabay.com/api/docs/)

logging:
  level:
    com.lifewise: debug
