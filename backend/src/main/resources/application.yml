spring:
  application:
    name: LifeWiseBackend

  datasource:
    url: jdbc:h2:file:./data/lifewise;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

ai:
  api-url: ${AI_API_URL:https://api.deepseek.com/v1/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-v4-flash}  # 备用模型（贵，仅在选择 DeepSeek 时使用）
  deepseek-enabled: ${AI_DEEPSEEK_ENABLED:false}  # 扣费保护：默认禁用 DeepSeek，必须显式开启
  # DashScope (千问) 配置 ⭐ 默认模型（便宜、缓存命中率高）
  dashscope-api-url: ${AI_DASHSCOPE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  dashscope-api-key: ${AI_DASHSCOPE_KEY:}
  dashscope-model: ${AI_DASHSCOPE_MODEL:qwen-plus}
  # Ollama 本地配置
  ollama-url: ${AI_OLLAMA_URL:http://localhost:11434/api/chat}
  ollama-model: ${AI_OLLAMA_MODEL:qwen2.5:7b}
  # 视觉/图片配置
  vision-api-url: ${AI_VISION_API_URL:}
  vision-api-key: ${AI_VISION_API_KEY:}
  vision-model: ${AI_VISION_MODEL:mimo-v2-omni}

app:
  vision-enabled: ${APP_VISION_ENABLED:true}
  upload-dir: ./uploads
  image-api-key: ${IMAGE_API_KEY:}

logging:
  level:
    com.lifewise: debug

gl-image:
  api-key: ${GL_IMAGE_API_KEY:}
  api-url: ${GL_IMAGE_API_URL:https://api.lk888.ai/api}



