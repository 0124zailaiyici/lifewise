<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景卡片样式对比</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #f5f5f5; padding: 40px 20px; }
h2 { text-align: center; margin-bottom: 40px; color: #333; font-size: 22px; }
.section { margin-bottom: 50px; }
.section h3 { font-size: 16px; color: #666; margin-bottom: 16px; padding-left: 10px; border-left: 3px solid #22c55e; }

.grid { display: flex; gap: 12px; flex-wrap: wrap; max-width: 500px; margin: 0 auto; }
.card {
  width: calc(50% - 6px);
  height: 100px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* 方案2：SVG图标 */
.card-svg .icon-wrap {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 6px;
}
.card-svg svg { width: 28px; height: 28px; }
.card-svg .label { font-size: 13px; font-weight: 600; color: #333; }

/* 方案3：背景插图 */
.card-bg {
  background-size: cover !important;
  background-position: center !important;
  position: relative;
  overflow: hidden;
}
.card-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.7);
  border-radius: 16px;
}
.card-bg .label {
  font-size: 15px; font-weight: 700; color: #111;
  position: relative; z-index: 1;
  text-shadow: 0 1px 4px rgba(255,255,255,0.8);
}

/* emoji对照 */
.card-emoji { font-size: 32px; }
.card-emoji .label { font-size: 13px; font-weight: 600; color: #333; margin-top: 4px; }
</style>
</head>
<body>

<h2>🎨 场景卡片样式对比</h2>

<!-- 当前方案：emoji -->
<div class="section">
  <h3>方案1：当前 Emoji 方案</h3>
  <div class="grid">
    <div class="card card-emoji" style="background: linear-gradient(135deg, #fef2f2, #fecaca);">🍳<span class="label">做饭助手</span></div>
    <div class="card card-emoji" style="background: linear-gradient(135deg, #f0fdf4, #bbf7d0);">🛒<span class="label">买菜指南</span></div>
    <div class="card card-emoji" style="background: linear-gradient(135deg, #eff6ff, #bfdbfe);">🔧<span class="label">修理指南</span></div>
    <div class="card card-emoji" style="background: linear-gradient(135deg, #faf5ff, #e9d5ff);">🏠<span class="label">家务技巧</span></div>
  </div>
</div>

<!-- 方案2：SVG图标 -->
<div class="section">
  <h3>方案2：SVG 图标 — 更精致、统一风格</h3>
  <div class="grid">
    <div class="card card-svg" style="background: linear-gradient(135deg, #fef2f2, #fecaca);">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 13.87A4 4 0 0 1 9.5 10a4.5 4.5 0 0 1 4.5 4.5c0 1.5-.5 3-1.5 4.2A6 6 0 0 1 6 13.87Z"/>
          <path d="M18 12a3 3 0 0 1-3-3"/>
          <path d="M18 6v6"/>
          <path d="M21 12h-3"/>
          <path d="M12 3c-1.5 1.5-2 3.5-2 5.5"/>
        </svg>
      </div>
      <span class="label">做饭助手</span>
    </div>
    <div class="card card-svg" style="background: linear-gradient(135deg, #f0fdf4, #bbf7d0);">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <span class="label">买菜指南</span>
    </div>
    <div class="card card-svg" style="background: linear-gradient(135deg, #eff6ff, #bfdbfe);">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <span class="label">修理指南</span>
    </div>
    <div class="card card-svg" style="background: linear-gradient(135deg, #faf5ff, #e9d5ff);">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="label">家务技巧</span>
    </div>
  </div>
</div>

<!-- 方案3：背景插图（用 Unsplash 图片） -->
<div class="section">
  <h3>方案3：背景插图 — 更有生活气息</h3>
  <div class="grid">
    <div class="card card-bg" style="background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), url('https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&h=300&fit=crop');">
      <span class="label">🍳 做饭助手</span>
    </div>
    <div class="card card-bg" style="background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?w=400&h=300&fit=crop');">
      <span class="label">🛒 买菜指南</span>
    </div>
    <div class="card card-bg" style="background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), url('https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=400&h=300&fit=crop');">
      <span class="label">🔧 修理指南</span>
    </div>
    <div class="card card-bg" style="background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), url('https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&h=300&fit=crop');">
      <span class="label">🏠 家务技巧</span>
    </div>
  </div>
  <p style="text-align:center;margin-top:12px;font-size:12px;color:#999;">图片来自 Unsplash，实际使用时需要自己准备或找免费图库</p>
</div>

</body>
</html>
