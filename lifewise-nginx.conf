# ===== pose-guide =====
server {
    listen 80;
    server_name 47.106.126.50;
    return 301 https://System.Management.Automation.Internal.Host.InternalHost;
}

server {
    listen 443 ssl;
    server_name 47.106.126.50;
    ssl_certificate /opt/pose-guide/server.crt;
    ssl_certificate_key /opt/pose-guide/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/pose-guide;
    index index.html;
    location / {
        try_files  / =404;
    }
}

# ===== LifeWise =====
server {
    listen 80;
    location /lifewise/ {
        alias /var/www/lifewise/;
        index index.html;
        try_files  / /lifewise/index.html;
    }
    location /lifewise/api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_read_timeout 120s;
    }
    location /lifewise/uploads/ {
        proxy_pass http://localhost:8080/uploads/;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
    }
    location /lifewise/assets/ {
        alias /var/www/lifewise/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
