services:
  - type: web
    name: lifewise-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AI_API_URL
        value: https://api.mi-ai.com/v1/chat/completions
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-chat
      - key: APP_VISION_ENABLED
        value: "true"
      - key: AI_VISION_API_URL
        sync: false
      - key: AI_VISION_API_KEY
        sync: false
      - key: AI_VISION_MODEL
        value: mimo-v2-omni
